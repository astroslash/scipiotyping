[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scipiotyping"
version = "1.3.0"
description = "An offline-first educational typing tutor"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "waitress>=3.0,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
