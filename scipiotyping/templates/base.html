<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}ScipioTyping{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.index') }}">Scipio<span>Typing</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('main.library') }}">Library</a>
      <a href="{{ url_for('main.progress') }}">Progress</a>
      <a href="{{ url_for('main.parent') }}">Parent</a>
      <a href="{{ url_for('main.help_page') }}">Help</a>
    </nav>
  </header>
  <main id="main" class="container">{% block content %}{% endblock %}</main>
  <footer>Private, local, and subscription-free.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
