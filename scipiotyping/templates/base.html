<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}ScipioTyping{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ url_for('main.index') }}">Scipio<span>Typing</span></a>
    <div id="daily-goal" class="daily-goal{% if daily_practice.goal_reached %} goal-reached{% endif %}" data-base-seconds="{{ daily_practice.active_seconds }}" data-goal-seconds="{{ daily_practice.goal_seconds }}">
      <label id="daily-goal-label" for="daily-goal-progress">{% if daily_practice.goal_reached %}Daily goal reached!{% else %}Today: <span id="daily-time">{{ format_duration(daily_practice.active_seconds) }}</span> / <span id="daily-goal-time">{{ format_duration(daily_practice.goal_seconds) }}</span>{% endif %}</label>
      <progress id="daily-goal-progress" value="{{ [daily_practice.active_seconds, daily_practice.goal_seconds]|min }}" max="{{ daily_practice.goal_seconds }}" aria-describedby="daily-goal-label"></progress>
    </div>
    <nav aria-label="Main navigation">
      <a href="{{ url_for('main.library') }}">Library</a>
      <a href="{{ url_for('main.lessons') }}">Lessons</a>
      <a href="{{ url_for('main.progress') }}">Progress</a>
      <a href="{{ url_for('main.profiles_page') }}">Profiles</a>
      <a href="{{ url_for('main.parent') }}">Parent</a>
      <a href="{{ url_for('main.help_page') }}">Help</a>
    </nav>
  </header>
  <main id="main" class="container">{% block content %}{% endblock %}</main>
  <footer><p>Private, local, and subscription-free.</p><div class="display-controls" aria-label="Display controls"><button type="button" data-display="large">Larger text</button><button type="button" data-display="contrast">High contrast</button></div></footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
